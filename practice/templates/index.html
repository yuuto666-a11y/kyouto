<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>大学マップ</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<!-- ========================================
     検索バー
========================================= -->

<div class="search-bar">

    <div class="search-row">

        <input
            id="searchInput"
            list="buildingList"
            placeholder="🔍 建物コードを入力">

        <button
            id="menu-button"
            class="menu-button"
            type="button">

            ☰

        </button>

    </div>

    <datalist id="buildingList"></datalist>

</div>



<!-- ========================================
     サイドメニュー背景
========================================= -->

<div
    id="menu-overlay"
    class="menu-overlay">
</div>



<!-- ========================================
     サイドメニュー
========================================= -->

<div
    id="side-menu"
    class="side-menu">


    <!-- メニューヘッダー -->

    <div class="side-menu-header">

        <h2>メニュー</h2>

        <button
            id="menu-close"
            class="menu-close"
            type="button">

            ×

        </button>

    </div>



    <!-- メニュー項目 -->

    <div class="menu-items">


        <!-- キャンパスマップ -->

        <button
            class="menu-item"
            id="menu-map"
            type="button">

            <span>🗺️</span>
            <span>キャンパスマップ</span>

        </button>



        <!-- 時間割 -->

        <button
            class="menu-item"
            id="menu-timetable"
            type="button">

            <span>📅</span>
            <span>時間割</span>

        </button>



        <!-- トイレ -->

        <button
            class="menu-item"
            id="menu-toilet"
            type="button">

            <span>🚻</span>
            <span>トイレ</span>

        </button>



        <!-- 現在地 -->

        <button
            class="menu-item"
            id="menu-gps"
            type="button">

            <span>📍</span>
            <span>現在地</span>

        </button>



        <!-- バス情報 -->

        <button
            class="menu-item"
            id="menu-bus"
            type="button">

            <span>🚌</span>
            <span>バス情報</span>

        </button>



        <!-- 設定 -->

        <button
            class="menu-item"
            id="menu-settings"
            type="button">

            <span>⚙️</span>
            <span>設定</span>

        </button>


    </div>

</div>



<!-- ========================================
     時間割
========================================= -->

<div
    id="timetable-overlay"
    class="timetable-overlay">


    <div class="timetable-card">


        <!-- 時間割ヘッダー -->

        <div class="timetable-header">

            <h2>📅 時間割</h2>

            <button
                id="timetable-close"
                type="button">

                ×

            </button>

        </div>



        <!-- 時間割本体 -->

        <div class="timetable-content">


            <table class="timetable">


                <thead>

                    <tr>

                        <th></th>

                        <th>月</th>

                        <th>火</th>

                        <th>水</th>

                        <th>木</th>

                        <th>金</th>

                    </tr>

                </thead>



                <tbody>


                    <!-- 1限 -->

                    <tr>

                        <th>1限</th>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>



                    <!-- 2限 -->

                    <tr>

                        <th>2限</th>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>



                    <!-- 3限 -->

                    <tr>

                        <th>3限</th>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>



                    <!-- 4限 -->

                    <tr>

                        <th>4限</th>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>



                    <!-- 5限 -->

                    <tr>

                        <th>5限</th>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>


                </tbody>


            </table>


        </div>


    </div>


</div>



<!-- ========================================
     メインコンテンツ
========================================= -->

<div class="container">


    <!-- 地図 -->

    <div class="map-area">

        <div class="map-container">

            <img
                src="{{ url_for('static', filename='campusmap.jpg') }}"
                id="map"
                class="map-image"
                alt="京都橘大学キャンパスマップ">

        </div>

    </div>


</div>



<!-- ========================================
     建物情報ポップアップ
========================================= -->

<div
    id="popup-overlay"
    class="popup-overlay">


    <div class="popup-card">


        <!-- 閉じる -->

        <button
            id="close-popup"
            class="close-btn"
            type="button">

            ×

        </button>



        <!-- 建物名 -->

        <h2 id="building-name">
            建物名
        </h2>



        <!-- ====================================
             バス運行情報
        ===================================== -->

        <div
            id="bus-live-info"
            class="bus-live-info"
            hidden>


            <!-- 路線 -->

            <div class="bus-route-buttons">


                <button
                    type="button"
                    class="bus-route-btn active"
                    data-route="nagitsuji">

                    椥辻

                </button>


                <button
                    type="button"
                    class="bus-route-btn"
                    data-route="yamashina">

                    山科

                </button>


                <button
                    type="button"
                    class="bus-route-btn"
                    data-route="kyoto">

                    京都駅

                </button>


            </div>



            <!-- 発着 -->

            <div class="bus-direction-buttons">


                <button
                    type="button"
                    class="bus-direction-btn active"
                    data-stop-mode="university"
                    data-direction="fromUniversity">

                    大学発

                </button>


                <button
                    type="button"
                    class="bus-direction-btn"
                    data-stop-mode="university"
                    data-direction="toUniversity">

                    大学着

                </button>


                <button
                    type="button"
                    class="bus-direction-btn bus-oyake-direction"
                    data-stop-mode="oyake"
                    data-direction="fromUniversity"
                    hidden>

                    大宅発

                </button>


                <button
                    type="button"
                    class="bus-direction-btn bus-oyake-direction"
                    data-stop-mode="oyake"
                    data-direction="toUniversity"
                    hidden>

                    大宅着

                </button>


            </div>



            <!-- 路線名 -->

            <div
                id="bus-route-name"
                class="bus-route-name">

                京都橘大学 → 椥辻

            </div>



            <!-- 次のバス -->

            <div class="bus-live-title">

                次のバス

            </div>



            <div
                id="next-bus-time"
                class="next-bus-time">

                --:--

            </div>



            <!-- カウントダウン -->

            <div
                id="bus-countdown"
                class="bus-countdown">

                発車時刻を確認中...

            </div>



            <!-- 運行状態 -->

            <div
                id="bus-status"
                class="bus-status">

            </div>


        </div>



        <!-- ====================================
             写真スライダー
        ===================================== -->

        <div class="photo-slider">


            <!-- 前 -->

            <button
                id="prev-photo"
                class="slide-btn"
                type="button"
                aria-label="前の写真">

                ◀

            </button>



            <!-- 写真 -->

            <img
                id="building-photo"
                class="building-photo"
                src=""
                alt="建物写真"
                loading="lazy"
                decoding="async"
                draggable="false">



            <!-- 次 -->

            <button
                id="next-photo"
                class="slide-btn"
                type="button"
                aria-label="次の写真">

                ▶

            </button>


        </div>



        <!-- 建物説明 -->

        <p id="building-description">

            建物説明

        </p>


    </div>


</div>



<!-- ========================================
     JavaScript
========================================= -->


<!-- 建物データ -->

<script
    src="{{ url_for('static', filename='buildingData.js') }}">
</script>



<!-- メインJavaScript -->

<script
    src="{{ url_for('static', filename='script.js') }}">
</script>


</body>

</html>
