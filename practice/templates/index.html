<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>大学マップ</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="/static/style.css">

</head>


<body>


<!-- ========================================
     検索バー
========================================= -->

<div class="search-bar">

    <div class="search-row">

        <input
            id="searchInput"
            list="buildingList"
            placeholder="🔍 建物コードを入力">

        <button
            id="menu-button"
            class="menu-button"
            type="button">

            ☰

        </button>

    </div>

    <datalist id="buildingList"></datalist>

</div>



<!-- ========================================
     サイドメニュー背景
========================================= -->

<div
    id="menu-overlay"
    class="menu-overlay">
</div>



<!-- ========================================
     サイドメニュー
========================================= -->

<div
    id="side-menu"
    class="side-menu">


    <!-- メニューヘッダー -->

    <div class="side-menu-header">

        <h2>メニュー</h2>

        <button
            id="menu-close"
            class="menu-close"
            type="button">

            ×

        </button>

    </div>



    <!-- メニュー項目 -->

    <div class="menu-items">


        <!-- キャンパスマップ -->

        <button
            class="menu-item"
            id="menu-map"
            type="button">

            <span>🗺️</span>
            <span>キャンパスマップ</span>

        </button>



        <!-- 時間割 -->

        <button
            class="menu-item"
            id="menu-timetable"
            type="button">

            <span>📅</span>
            <span>時間割</span>

        </button>



        <!-- トイレ -->

        <button
            class="menu-item"
            id="menu-toilet"
            type="button">

            <span>🚻</span>
            <span>トイレ</span>

        </button>



        <!-- 現在地 -->

        <button
            class="menu-item"
            id="menu-gps"
            type="button">

            <span>📍</span>
            <span>現在地</span>

        </button>



        <!-- バス情報 -->

        <button
            class="menu-item"
            id="menu-bus"
            type="button">

            <span>🚌</span>
            <span>バス情報</span>

        </button>



        <!-- 設定 -->

        <button
            class="menu-item"
            id="menu-settings"
            type="button">

            <span>⚙️</span>
            <span>設定</span>

        </button>


    </div>

</div>



<!-- ========================================
     時間割
========================================= -->

<div
    id="timetable-overlay"
    class="timetable-overlay">


    <div class="timetable-card">


        <!-- 時間割ヘッダー -->

        <div class="timetable-header">

            <h2>📅 時間割</h2>

            <button
                id="timetable-close"
                type="button">

                ×

            </button>

        </div>



        <!-- 時間割本体 -->

        <div class="timetable-content">


            <table class="timetable">


                <thead>

                    <tr>

                        <th></th>

                        <th>月</th>

                        <th>火</th>

                        <th>水</th>

                        <th>木</th>

                        <th>金</th>

                    </tr>

                </thead>



                <tbody>


                    <!-- 1限 -->

                    <tr>

                        <th>1限</th>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>



                    <!-- 2限 -->

                    <tr>

                        <th>2限</th>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>



                    <!-- 3限 -->

                    <tr>

                        <th>3限</th>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>



                    <!-- 4限 -->

                    <tr>

                        <th>4限</th>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>



                    <!-- 5限 -->

                    <tr>

                        <th>5限</th>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>


                </tbody>


            </table>


        </div>


    </div>


</div>



<!-- ========================================
     メインコンテンツ
========================================= -->

<div class="container">


    <!-- 地図 -->

    <div class="map-area">

        <div class="map-container">

            <img
                src="{{ url_for('static', filename='campusmap.jpg') }}"
                id="map"
                class="map-image"
                alt="京都橘大学キャンパスマップ">

        </div>

    </div>


</div>



<!-- ========================================
     建物情報ポップアップ
========================================= -->

<div
    id="popup-overlay"
    class="popup-overlay">


    <div class="popup-card">


        <!-- 閉じる -->

        <button
            id="close-popup"
            class="close-btn"
            type="button">

            ×

        </button>



        <!-- 建物名 -->

        <h2 id="building-name">
            建物名
        </h2>



        <!-- ====================================
             バス運行情報
        ===================================== -->

        <div
            id="bus-live-info"
            class="bus-live-info"
            hidden>


            <!-- 路線 -->

            <div class="bus-route-buttons">


                <button
                    type="button"
                    class="bus-route-btn active"
                    data-route="nagitsuji">

                    椥辻

                </button>


                <button
                    type="button"
                    class="bus-route-btn"
                    data-route="yamashina">

                    山科

                </button>


                <button
                    type="button"
                    class="bus-route-btn"
                    data-route="kyoto">

                    京都駅

                </button>


            </div>



            <!-- 発着 -->

            <div class="bus-direction-buttons">


                <button
                    type="button"
                    class="bus-direction-btn active"
                    data-stop-mode="university"
                    data-direction="fromUniversity">

                    大学発

                </button>


                <button
                    type="button"
                    class="bus-direction-btn"
                    data-stop-mode="university"
                    data-direction="toUniversity">

                    大学着

                </button>


                <button
                    type="button"
                    class="bus-direction-btn bus-oyake-direction"
                    data-stop-mode="oyake"
                    data-direction="fromUniversity"
                    hidden>

                    大宅発

                </button>


                <button
                    type="button"
                    class="bus-direction-btn bus-oyake-direction"
                    data-stop-mode="oyake"
                    data-direction="toUniversity"
                    hidden>

                    大宅着

                </button>


            </div>



            <!-- 路線名 -->

            <div
                id="bus-route-name"
                class="bus-route-name">

                京都橘大学 → 椥辻

            </div>



            <!-- 次のバス -->

            <div class="bus-live-title">

                次のバス

            </div>



            <div
                id="next-bus-time"
                class="next-bus-time">

                --:--

            </div>



            <!-- カウントダウン -->

            <div
                id="bus-countdown"
                class="bus-countdown">

                発車時刻を確認中...

            </div>



            <!-- 運行状態 -->

            <div
                id="bus-status"
                class="bus-status">

            </div>


        </div>



        <!-- ====================================
             写真スライダー
        ===================================== -->

        <div class="photo-slider">


            <!-- 前 -->

            <button
                id="prev-photo"
                class="slide-btn"
                type="button"
                aria-label="前の写真">

                ◀

            </button>



            <!-- 写真 -->

            <img
                id="building-photo"
                class="building-photo"
                src=""
                alt="建物写真"
                loading="lazy"
                decoding="async"
                draggable="false">



            <!-- 次 -->

            <button
                id="next-photo"
                class="slide-btn"
                type="button"
                aria-label="次の写真">

                ▶

            </button>


        </div>



        <!-- 建物説明 -->

        <p id="building-description">

            建物説明

        </p>


    </div>


</div>



<!-- ========================================
     JavaScript
========================================= -->


<!-- 建物データ -->

<script
    src="/static/buildingData.js">
</script>



<!-- メインJavaScript -->

<script
    src="/static/script.js">
</script>



<script>
/* =========================================================
   建物ピン・ポップアップ修正版
   既存のscript.jsが作るピンのクラス名に依存しないよう、
   地図上の建物要素を幅広く検出してポップアップを開きます。
========================================================= */
(function () {
  "use strict";

  function openBuildingPopup(pin) {
    const overlay = document.getElementById("popup-overlay");
    const nameEl = document.getElementById("building-name");
    const descEl = document.getElementById("building-description");
    const photoEl = document.getElementById("building-photo");
    if (!overlay || !nameEl || !descEl) return;

    const attrs = [
      "data-building-name",
      "data-building",
      "data-code",
      "data-id",
      "data-building-code"
    ];

    let code = "";
    for (const a of attrs) {
      if (pin.dataset && pin.dataset[a.slice(5)]) {
        code = pin.dataset[a.slice(5)];
        break;
      }
    }

    if (!code) code =
      pin.getAttribute("title") ||
      pin.getAttribute("aria-label") ||
      pin.textContent.trim();

    const db =
      window.BUILDING_INFO ||
      window.buildingData ||
      window.buildings ||
      window.BUILDINGS ||
      {};

    let info = db[code];

    // コードがキーと完全一致しない場合にも対応
    if (!info && code) {
      const key = Object.keys(db).find(k =>
        String(k).toLowerCase() === String(code).toLowerCase()
      );
      if (key) info = db[key];
    }

    nameEl.textContent =
      (info && (info.fullName || info.name || info.title)) || code || "建物情報";

    descEl.textContent =
      (info && (info.description || info.desc || info.detail)) ||
      "この建物の詳細情報は登録されていません。";

    if (photoEl) {
      let photos = [];
      if (info) {
        if (Array.isArray(info.photos)) photos = info.photos;
        else if (info.photo) photos = [info.photo];
        else if (info.image) photos = [info.image];
      }

      if (photos.length) {
        let p = String(photos[0]);
        if (!/^(https?:|data:|\/)/.test(p)) p = "/static/" + p;
        photoEl.src = p;
        photoEl.style.display = "";
      } else {
        photoEl.removeAttribute("src");
        photoEl.style.display = "none";
      }
    }

    overlay.style.display = "flex";
    overlay.classList.add("show");
    document.body.classList.add("popup-open");
  }

  function isPin(el) {
    if (!el || el === document.body || el === document.documentElement) return false;
    if (el.id === "map") return false;

    const cls = String(el.className || "").toLowerCase();
    const role = String(el.getAttribute("role") || "").toLowerCase();
    const hasData =
      el.hasAttribute("data-building-name") ||
      el.hasAttribute("data-building") ||
      el.hasAttribute("data-building-code") ||
      el.hasAttribute("data-code");

    return hasData ||
      /building|pin|marker/.test(cls) ||
      role === "button";
  }

  document.addEventListener("click", function (e) {
    const close = e.target.closest("#close-popup");
    if (close) {
      const overlay = document.getElementById("popup-overlay");
      if (overlay) {
        overlay.style.display = "none";
        overlay.classList.remove("show");
      }
      document.body.classList.remove("popup-open");
      return;
    }

    const overlay = document.getElementById("popup-overlay");
    if (overlay && e.target === overlay) {
      overlay.style.display = "none";
      overlay.classList.remove("show");
      document.body.classList.remove("popup-open");
      return;
    }

    let el = e.target;
    let pin = null;

    // 地図エリア内でクリックされた建物要素を上方向に探す
    while (el && el !== document.body) {
      if (isPin(el)) {
        const mapArea = el.closest(".map-container, .map-area, #map-wrapper");
        if (mapArea || el.parentElement && el.parentElement.closest(".map-container, .map-area")) {
          pin = el;
          break;
        }
      }
      el = el.parentElement;
    }

    if (pin) {
      e.stopPropagation();
      openBuildingPopup(pin);
    }
  }, true);

  // ポップアップがCSSでdisplay:none固定でも確実に表示できるようにする
  const style = document.createElement("style");
  style.textContent = `
    #popup-overlay.show { display:flex !important; }
    #popup-overlay { z-index:99999; }
    #close-popup { cursor:pointer; }
    .popup-open { overflow:hidden; }
  `;
  document.head.appendChild(style);

  // メニューボタンも外部JSが失敗した場合に最低限開けるようにする
  document.addEventListener("click", function (e) {
    if (e.target.closest("#menu-button")) {
      const menu = document.getElementById("side-menu");
      const overlay = document.getElementById("menu-overlay");
      if (menu) menu.classList.add("open", "active", "show");
      if (overlay) overlay.classList.add("open", "active", "show");
    }
    if (e.target.closest("#menu-close, #menu-overlay")) {
      const menu = document.getElementById("side-menu");
      const overlay = document.getElementById("menu-overlay");
      if (menu) menu.classList.remove("open", "active", "show");
      if (overlay) overlay.classList.remove("open", "active", "show");
    }
  }, true);
})();
</script>

</body>

</html>
