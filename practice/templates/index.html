<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <!-- スマホ表示対応 -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>大学マップ</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


    <!-- ==========================
         検索バー
    =========================== -->

    <div class="search-bar">

        <input
            type="text"
            id="searchInput"
            list="buildingList"
            placeholder="🔍建物コードを入力">

        <datalist id="buildingList"></datalist>

    </div>



    <!-- ==========================
         メインコンテンツ
    =========================== -->

    <div class="container">


        <!-- ==========================
             地図
        =========================== -->

        <div class="map-area">


            <div class="map-container">


                <!--
                    PC・スマホ共通の地図画像
                -->

                <img
                    src="{{ url_for('static', filename='campusmap.jpg') }}"
                    id="map"
                    class="map-image"
                    alt="京都橘大学キャンパスマップ">


                <!--
                    建物ピンとGPS現在地は
                    script.jsから
                    map-container内に自動追加されます
                -->


            </div>


        </div>


    </div>



    <!-- ==========================
         建物情報ポップアップ
    =========================== -->

    <div
        id="popup-overlay"
        class="popup-overlay">


        <div class="popup-card">


            <!-- 閉じるボタン -->

            <button
                id="close-popup"
                class="close-btn"
                type="button">

                ×

            </button>



            <!-- 建物名 -->

            <h2 id="building-name">

                建物名

            </h2>



            <!-- ==========================
                 写真スライダー
            =========================== -->

            <div class="photo-slider">


                <!-- 前の写真 -->

                <button
                    id="prev-photo"
                    class="slide-btn"
                    type="button"
                    aria-label="前の写真">

                    ◀

                </button>



                <!-- 建物写真 -->

                <img
                    id="building-photo"
                    class="building-photo"
                    src=""
                    alt="建物写真">



                <!-- 次の写真 -->

                <button
                    id="next-photo"
                    class="slide-btn"
                    type="button"
                    aria-label="次の写真">

                    ▶

                </button>


            </div>



            <!-- 建物説明 -->

            <p id="building-description">

                建物説明

            </p>


        </div>


    </div>



    <!-- ==========================
         JavaScript
    =========================== -->


    <!-- 建物データ -->

    <script
        src="{{ url_for('static', filename='buildingData.js') }}">
    </script>


    <!--
        検索
        建物ピン
        ポップアップ
        写真切替
        スワイプ
        地図サイズ調整
        GPS
    -->

    <script
        src="{{ url_for('static', filename='script.js') }}">
    </script>


</body>

</html>
